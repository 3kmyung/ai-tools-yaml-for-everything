<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ui checks</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #subject { display: block; width: 100%; height: 100%; border: 0; }
    #results { position: fixed; inset: 0; margin: 0; padding: 0; visibility: hidden; }
  </style>
</head>
<body>
  <iframe id="subject" src="./index.html"></iframe>
  <ul id="results"></ul>
  <script type="module">
    import { CHECKS as portableChecks } from "./checks.js";

    const frame = document.getElementById("subject");
    const results = document.getElementById("results");

    function appendResult(className, text) {
      const entry = document.createElement("li");
      entry.className = className;
      entry.textContent = text;

      results.appendChild(entry);
    }

    async function loadLocalChecks() {
      const response = await fetch("./checks.local.js");

      if (response.status === 404) {
        appendResult("info", "0 per-example checks — no checks.local.js in this example");
        return [];
      }

      if (!response.ok) throw new Error(`checks.local.js returned ${response.status}`);

      const module = await import("./checks.local.js");
      const count = module.CHECKS.length;

      appendResult("info", `${count} per-example check${count === 1 ? "" : "s"} loaded from checks.local.js`);

      return module.CHECKS;
    }

    await new Promise((resolve) => {
      const navigated = frame.contentDocument
        && frame.contentDocument.readyState === "complete"
        && frame.contentWindow.location.href !== "about:blank";

      if (navigated) resolve();
      else frame.addEventListener("load", resolve, { once: true });
    });

    const frameDocument = frame.contentDocument;
    const frameWindow = frame.contentWindow;

    const localChecks = await loadLocalChecks();
    const CHECKS = [ ...portableChecks, ...localChecks ];

    for (const check of CHECKS) {
      const outcome = await Promise.resolve().then(() => check.run(frameDocument, frameWindow)).catch((failure) => String(failure));
      const passed = outcome === true;

      appendResult(passed ? "pass" : "fail", (passed ? "PASS " : "FAIL ") + check.name + (passed ? "" : " — " + outcome));
    }

    document.title = "done";
  </script>
</body>
</html>
