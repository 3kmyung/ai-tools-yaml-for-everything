<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transcribe a Long Meeting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
</head>
<body>
  <header>
    <button id="back-to-segments" class="action-cancel action-back" type="button">Back</button>
    <div class="scroll-fade">
      <div id="settings">
        <div class="setting">
          <label class="field-label" for="hotwords">Hotwords</label>
          <div class="field-line">
            <input type="text" id="hotwords" placeholder="Microsoft, VibeVoice" />
          </div>
        </div>
        <span id="warning" class="caption-warning" hidden></span>
      </div>
    </div>
    <button id="transcribe" class="action-primary" type="button">Transcribe</button>
  </header>
  <div class="scroll-fade">
    <main>
      <section id="segments" aria-label="Segments">
        <div class="scroll-fade">
          <div id="segment-scroller">
            <p id="segments-hint">Segments will appear here once a file is transcribed.</p>
            <ol id="segment-list"></ol>
          </div>
        </div>
      </section>
      <div class="scroll-fade">
        <div id="workspace">
          <p id="hint">No transcription yet.</p>
          <section id="dropzone" class="dropzone"></section>
          <section id="timeline" hidden>
            <div class="scroll-fade">
              <div id="timeline-scroller"></div>
            </div>
            <ol id="timeline-legend" class="timeline-legend"></ol>
          </section>
          <section id="detail" hidden></section>
        </div>
      </div>
    </main>
  </div>
  <footer>
    <div class="scroll-fade">
      <div id="log" role="status" hidden></div>
    </div>
    <button id="transcribe-compact" class="action-primary" type="button">Transcribe</button>
  </footer>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
