<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VibeVoice Speaker Diarization</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header>
    <div id="settings">
      <div class="field" data-field="audio" id="audio-field">
        <div class="field-body">
          <label class="field-label" for="audio-file">Audio file</label>
          <div class="field-control is-default" id="audio-control">
            <input class="field-file-input" type="file" id="audio-file" accept="audio/*" />
            <label class="field-line field-file-pick" for="audio-file">
              <span class="field-file-name" id="audio-name">No file chosen</span>
              <svg class="icon" data-icon="upload"></svg>
            </label>
          </div>
          <span id="warning" class="caption-warning" hidden></span>
        </div>
        <button class="revert-field" type="button" id="audio-revert" aria-label="Clear the chosen file" disabled>
          <svg class="icon" data-icon="rotate-ccw"></svg>
        </button>
      </div>
      <div class="field" data-field="hotwords">
        <div class="field-body">
          <label class="field-label" for="hotwords">Hotwords</label>
          <div class="field-control is-default" id="hotwords-control">
            <div class="field-line">
              <input type="text" id="hotwords" value="" placeholder="Names or terms, comma-separated" autocomplete="off" spellcheck="false" />
            </div>
          </div>
        </div>
        <button class="revert-field" type="button" id="hotwords-revert" aria-label="Clear hotwords" disabled>
          <svg class="icon" data-icon="rotate-ccw"></svg>
        </button>
      </div>
    </div>
    <button class="action-primary" type="button" id="transcribe" disabled>Transcribe</button>
  </header>
  <main>
    <section id="overview" aria-labelledby="source-name">
      <div id="summary">
        <h1 id="source-name">Sample recording</h1>
        <ul id="figures" class="figures"></ul>
      </div>
      <p id="hint" class="caption"></p>
      <div class="timeline" role="group" aria-label="Who spoke when">
        <div class="timeline-headers" id="timeline-headers"></div>
        <div class="scroll-fade" id="timeline-fade">
          <div class="timeline-tracks" id="timeline">
            <div class="timeline-canvas" id="timeline-canvas"></div>
          </div>
        </div>
      </div>
    </section>
    <div class="scroll-fade" id="segments-fade">
      <ol id="segments" aria-label="Segments"></ol>
    </div>
  </main>
  <footer>
    <div id="log" role="status" aria-live="polite"></div>
  </footer>
</body>
</html>
