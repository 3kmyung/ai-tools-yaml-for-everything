controller:
  adapter:
    type: http-server
    port: 8280
    base_path: /api
  webui:
    driver: gradio
    port: 8281

workflows:
  - id: detect-silences
    default: true
    title: Detect Silences
    description: Detect silent regions in an audio file using ffmpeg's silencedetect filter.
    job:
      component: silence-detector
      action: default
      output:
        segments: ${output as json}

  - id: detect-silences-strict
    title: Detect Silences (Strict)
    description: Detect only longer, quieter silences suitable for trimming leading/trailing dead air.
    job:
      component: silence-detector
      action: strict
      output:
        segments: ${output as json}

components:
  - id: silence-detector
    type: audio-silence-detector
    actions:
      - id: default
        audio: ${input.audio as file}
        silence_threshold: ${input.silence_threshold as number | -30.0}
        min_silence_duration: ${input.min_silence_duration as string | 500ms}
        output: ${result as json}

      - id: strict
        audio: ${input.audio as file}
        silence_threshold: -40.0
        min_silence_duration: 2s
        output: ${result as json}

  - id: webui
    type: http-server
    port: ${env.WEBUI_PORT | 4290}
    manage:
      working_dir: web
      install: [ node, -e, "require('node:child_process').execSync('pnpm install --frozen-lockfile', { stdio: 'inherit' })" ]
      build: [ node, node_modules/vite/bin/vite.js, build ]
      start: [ node, node_modules/vite/bin/vite.js, preview, --port, "${env.WEBUI_PORT | 4290}", --strictPort, --host ]

