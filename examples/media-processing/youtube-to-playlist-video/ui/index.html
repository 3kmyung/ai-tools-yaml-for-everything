<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube to Playlist Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header>
    <span class="setting"><span id="style-label">Style</span><button class="dropdown" id="style" type="button" aria-labelledby="style-label style"></button></span>
    <span class="setting"><span id="ratio-label">Ratio</span><button class="dropdown" id="ratio" type="button" aria-labelledby="ratio-label ratio"></button></span>
    <span class="setting"><span id="resolution-label">Resolution</span><button class="dropdown" id="resolution" type="button" aria-labelledby="resolution-label resolution"></button></span>
    <span class="setting"><span id="fps-label">FPS</span><button class="dropdown" id="fps" type="button" aria-labelledby="fps-label fps"></button></span>
    <span id="warning" hidden></span>
    <button id="render-playlist" type="button">Render</button>
  </header>
  <main>
    <section id="tracks">
      <ol></ol>
      <button id="add-track" type="button">Add track</button>
    </section>
    <div id="workspace">
      <p id="hint" hidden>Add a track to begin</p>
      <section id="editor"></section>
      <section id="preview"></section>
    </div>
  </main>
  <footer>
    <div id="log"></div>
  </footer>
  <script src="./templates/render-settings.js"></script>
  <script src="./templates/track-colors.js"></script>
  <script src="./templates/band-counts.js"></script>
  <script src="./templates/color-roles.js"></script>
  <script src="./templates/ratios.js"></script>
  <script src="./templates/preview-protocol.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
